# ComplyGCC — Nginx site (HTTP). Certbot adds the TLS (443) server block:
#   sudo certbot --nginx -d APP_DOMAIN
# Placeholders APP_DOMAIN / APP_DIR / PHP_VERSION are substituted by provision.sh.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    root APP_DIR/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;   # document uploads (vault)

    # Security headers (the app also sets these; belt and braces).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/phpPHP_VERSION-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env, .git, …).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/complygcc-access.log;
    error_log  /var/log/nginx/complygcc-error.log;
}
