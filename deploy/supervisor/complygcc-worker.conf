; ComplyGCC queue workers (SPEC.md §11). Processes notification + extraction
; jobs from Redis. Placeholders substituted by provision.sh.

[program:complygcc-worker]
process_name=%(program_name)s_%(process_num)02d
command=php APP_DIR/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=APP_DIR/backend
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=APP_DIR/backend/storage/logs/worker.log
stopasgroup=true
killasgroup=true
